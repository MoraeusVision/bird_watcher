<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bird Watcher</title>
  <style>
    :root {
      --ink: #17231d;
      --muted: #647268;
      --paper: #f4f6f0;
      --panel: #ffffff;
      --line: #dfe6dc;
      --moss: #286447;
      --moss-dark: #1c4834;
      --sun: #e6ae45;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Avenir Next", Avenir, "Trebuchet MS", sans-serif;
      position: relative;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      position: fixed;
      z-index: -1;
      inset: -18px;
      content: "";
      background: linear-gradient(rgba(244, 246, 240, 0.42), rgba(244, 246, 240, 0.42)),
        url("{{ url_for('background_image') }}") center / cover no-repeat;
    }

    .shell {
      width: min(1260px, 100%);
      margin: 0 auto;
      padding: 20px clamp(18px, 4vw, 56px) 28px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--moss);
      box-shadow: 0 5px 14px rgba(40, 100, 71, 0.24);
      font-family: Georgia, serif;
      font-size: 1.1rem;
    }

    .intro {
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 3.8rem;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(280px, 0.75fr);
      gap: 18px;
      align-items: stretch;
      height: min(480px, max(360px, calc(100vh - 350px)));
    }

    .feed-panel,
    .insight-panel {
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 16px 42px rgba(31, 58, 40, 0.08);
    }

    .feed-panel { min-height: 0; padding: 10px; }

    .feed-wrap {
      position: relative;
      overflow: hidden;
      height: 100%;
      min-height: 0;
      background: #d8e2d8;
    }

    .stream {
      width: 100%;
      height: 100%;
      min-height: 0;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #d8e2d8;
    }

    .insight-panel {
      display: flex;
      flex-direction: column;
      padding: clamp(22px, 3vw, 32px);
    }

    .panel-kicker {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .insight-panel h2 { margin: 12px 0 8px; font-size: 1.8rem; font-weight: 500; }

    .panel-copy { margin: 0; color: var(--muted); font-size: 0.92rem; line-height: 1.55; }

    .controls { margin-top: auto; padding-top: 34px; }

    button {
      width: 100%;
      border: 0;
      padding: 14px 18px;
      color: #fff;
      background: var(--moss);
      font: inherit;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    button:hover { background: var(--moss-dark); transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
    button:disabled { opacity: 0.65; cursor: wait; transform: none; }

    #result {
      display: block;
      min-height: 1.5em;
      margin-top: 16px;
      color: var(--moss-dark);
      font-family: Georgia, serif;
      font-size: 1.32rem;
      font-weight: 400;
    }

    #summary-panel {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.6;
      display: none;
      max-height: 112px;
      overflow-y: scroll;
      scrollbar-gutter: stable;
      scrollbar-color: var(--moss) var(--paper);
    }

    #summary-panel p { margin: 0; }

    #summary-panel::-webkit-scrollbar { width: 10px; }
    #summary-panel::-webkit-scrollbar-track { background: var(--paper); }
    #summary-panel::-webkit-scrollbar-thumb {
      border: 3px solid var(--paper);
      background: var(--moss);
    }

    .summary-scroll-button {
      display: block;
      width: 34px;
      min-height: 34px;
      margin: 8px 0 0 auto;
      padding: 0;
      color: var(--moss-dark);
      background: var(--paper);
      border: 1px solid var(--line);
      font-size: 1.15rem;
      line-height: 1;
    }

    .summary-scroll-button:hover { color: #fff; background: var(--moss); }
    .summary-scroll-button[hidden] { display: none; }

    @media (max-width: 760px) {
      .shell { padding-top: 20px; }
      .topbar { margin-bottom: 28px; }
      .workspace { grid-template-columns: 1fr; }
      .workspace { height: auto; }
      .feed-wrap, .stream { height: 240px; }
      .insight-panel { min-height: 300px; }
      h1 { font-size: 2.8rem; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">B</span> Bird Watcher</div>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">See who stops by.</h1>
    </section>

    <section class="workspace" aria-label="Bird observation">
      <div class="feed-panel">
        <div class="feed-wrap">
          <img class="stream" src="{{ url_for('video_feed') }}" alt="Live video stream from the bird camera">
        </div>
      </div>

      <aside class="insight-panel">
        <span class="panel-kicker">Species analysis</span>
        <h2>Who is in frame?</h2>
        <p class="panel-copy">Identify the bird in the current frame.</p>
        <div class="controls">
          <button id="analyze-btn" type="button">Birdalyze</button>
          <span id="result" role="status" aria-live="polite"></span>
        </div>
        <div id="summary-panel">
          <p id="summary-text"></p>
        </div>
        <button id="summary-scroll-button" class="summary-scroll-button" type="button"
          aria-label="Scroll for more information" hidden>↓</button>
      </aside>
    </section>
  </main>

  <script>
    const button = document.getElementById('analyze-btn');
    const result = document.getElementById('result');
    const summaryPanel = document.getElementById('summary-panel');
    const summaryText = document.getElementById('summary-text');
    const summaryScrollButton = document.getElementById('summary-scroll-button');

    function updateSummaryScrollButton() {
      const canScroll = summaryPanel.scrollHeight > summaryPanel.clientHeight + 1;
      const atBottom = summaryPanel.scrollTop + summaryPanel.clientHeight >= summaryPanel.scrollHeight - 1;
      summaryScrollButton.hidden = !canScroll;
      summaryScrollButton.textContent = atBottom ? '↑' : '↓';
      summaryScrollButton.setAttribute(
        'aria-label',
        atBottom ? 'Scroll to the beginning of the summary' : 'Scroll for more information',
      );
    }

    summaryPanel.addEventListener('scroll', updateSummaryScrollButton);
    summaryScrollButton.addEventListener('click', () => {
      const atBottom = summaryPanel.scrollTop + summaryPanel.clientHeight >= summaryPanel.scrollHeight - 1;
      summaryPanel.scrollTo({ top: atBottom ? 0 : summaryPanel.scrollHeight, behavior: 'smooth' });
    });

    button.addEventListener('click', async () => {
      button.disabled = true;
      result.textContent = 'Analyzing...';

      try {
        const response = await fetch('/analyze', { method: 'POST' });
        const data = await response.json();

        if (!response.ok) {
          result.textContent = data.error || 'Analysis failed';
          summaryPanel.style.display = 'none';
          return;
        }

        result.textContent = data.result_text;

        if (data.species_summary) {
          summaryText.textContent = data.species_summary;
          summaryPanel.style.display = 'block';
          requestAnimationFrame(updateSummaryScrollButton);
        } else {
          summaryPanel.style.display = 'none';
          summaryScrollButton.hidden = true;
        }
      } catch (_error) {
        result.textContent = 'Could not reach the server';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
