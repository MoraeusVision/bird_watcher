<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bird Watcher</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --panel: #fffdf8;
      --text: #1d2a1f;
      --accent: #2f6f4f;
      --accent-strong: #1f4f37;
      --border: #d9d2c3;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: radial-gradient(circle at top right, #e7efe6 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      box-sizing: border-box;
    }

    .card {
      width: min(960px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1rem;
      box-shadow: 0 10px 30px rgba(35, 46, 35, 0.12);
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.3rem, 2vw, 1.8rem);
      letter-spacing: 0.02em;
    }

    .stream {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #d9e3d9;
      display: block;
    }

    .controls {
      margin-top: 1rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--accent-strong);
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    #result {
      font-size: 1rem;
      font-weight: 600;
    }

    #summary-panel {
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f0f5f0;
      font-size: 0.95rem;
      line-height: 1.6;
      display: none;
    }

    #summary-panel p {
      margin: 0;
      color: #3a4a3c;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Bird Watcher Live</h1>
    <img class="stream" src="{{ url_for('video_feed') }}" alt="Live videoström">

    <div class="controls">
      <button id="analyze-btn" type="button">Check bird species</button>
      <span id="result"></span>
    </div>

    <div id="summary-panel">
      <p id="summary-text"></p>
    </div>
  </main>

  <script>
    const button = document.getElementById('analyze-btn');
    const result = document.getElementById('result');
    const summaryPanel = document.getElementById('summary-panel');
    const summaryText = document.getElementById('summary-text');

    button.addEventListener('click', async () => {
      button.disabled = true;
      result.textContent = 'Analyserar...';

      try {
        const response = await fetch('/analyze', { method: 'POST' });
        const data = await response.json();

        if (!response.ok) {
          result.textContent = data.error || 'Analys misslyckades';
          summaryPanel.style.display = 'none';
          return;
        }

        result.textContent = data.result_text;

        if (data.species_summary) {
          summaryText.textContent = data.species_summary;
          summaryPanel.style.display = 'block';
        } else {
          summaryPanel.style.display = 'none';
        }
      } catch (_error) {
        result.textContent = 'Kunde inte nå servern';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
